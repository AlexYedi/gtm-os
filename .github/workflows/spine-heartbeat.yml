name: Spine keep-awake heartbeat

# Free-tier Supabase auto-pauses after ~7 idle days. A paused project can't run
# its own pg_cron (chicken-and-egg) and would gap topic_trend's as_of_date history —
# the exact data the heating/cooling story depends on. This daily ping keeps it warm
# and fails loudly (GitHub notification) if the spine ever goes unreachable.
# Ref: Phase_1/topic_intelligence_spec.md §4 (keep-awake dependency) · YED-120.

on:
  schedule:
    - cron: '17 6 * * *'   # daily 06:17 UTC (off-peak; arbitrary minute avoids the top-of-hour rush)
  workflow_dispatch:        # allow manual runs

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping spine REST root (least-privilege keep-warm)
        env:
          URL: ${{ secrets.SUPABASE_SPINE_URL }}
          # Publishable/anon key — client-safe, zero grants on the PII `signal` schema.
          # Enough to generate project activity + confirm reachability; exposes no data.
          KEY: ${{ secrets.SUPABASE_SPINE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${URL:-}" ] || [ -z "${KEY:-}" ]; then
            echo "::error::Missing SUPABASE_SPINE_URL / SUPABASE_SPINE_PUBLISHABLE_KEY repo secrets."
            exit 1
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' -m 30 \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            "${URL%/}/rest/v1/" || echo "000")
          echo "spine REST root -> HTTP $code"
          # Any HTTP response (2xx/4xx) = the project answered = activity = stays warm.
          # 000 = DNS/connection failure = paused or deleted -> alert.
          if [ "$code" = "000" ]; then
            echo "::error::Spine unreachable (likely auto-paused or deleted). Restore in the Supabase dashboard: project abkvgihlbwfloentugtd."
            exit 1
          fi
          echo "Spine is warm."
